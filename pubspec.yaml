name: "MoveLab"
description: Kapsamlı bir satranç analiz ve istatistik uygulaması.
publish_to: 'none'

version: 1.0.17+33

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http:
  flutter_chess_board:
  chess_vectors_flutter:
  chess:
  shared_preferences:
  stockfish:
  audioplayers:
  path_provider:
